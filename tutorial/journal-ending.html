<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
@font-face{font-family:Google Sans Flex;src:url(fv-today/fonts/google-sans-flex-latin.woff2);font-weight:100 900}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171514}#scene{position:absolute;width:1280px;height:832px;overflow:hidden;background:#f0f2f5;transform-origin:top left}#back{position:absolute;left:-125px;top:-57px;width:1589px;height:889px;object-fit:cover}.shade{position:absolute;inset:0;background:rgba(5,5,5,.6);backdrop-filter:blur(7.95px)}#book{position:absolute;left:384px;top:33px;width:513px;height:581px;object-fit:cover;filter:drop-shadow(0 0 8px #ffe7af) drop-shadow(0 0 20px #ffcc6b80)}.caption{position:absolute;top:387.5px;margin:0;color:white;font:900 24px/32px 'Google Sans Flex',system-ui}#left{left:95px;width:440px}#right{left:944.54px;width:281px}button{position:absolute;padding:0;border:0;background:transparent;cursor:pointer}#confirm{left:475.73px;top:627.12px;width:330px;height:76.735px}#exit{right:2.81%;top:3.94%;width:22px;height:21px}button:focus-visible{outline:2px solid #fff;outline-offset:6px}#scene{animation:reveal .55s ease-out}@keyframes reveal{from{opacity:0}to{opacity:1}}
</style></head><body><main id="scene"><img id="back" src="assets/book-ending/background.png" alt=""><div class="shade"></div><p id="left" class="caption">And there it is</p><img id="book" src="assets/book-ending/book.png" alt="Comma Book"><p id="right" class="caption">the story of your life</p><button id="confirm" aria-label="Sounds good"><img src="assets/book-ending/confirm.svg" alt="Sounds good"></button><button id="exit" aria-label="Finish tutorial"><img src="assets/book-ending/exit.svg" alt=""></button></main><script>
const scene=document.getElementById('scene');function fit(){const scale=Math.min(innerWidth/1280,innerHeight/832);scene.style.transform='scale('+scale+')';scene.style.left=(innerWidth-1280*scale)/2+'px';scene.style.top=(innerHeight-832*scale)/2+'px';}addEventListener('resize',fit);fit();
function finish(){parent.postMessage({type:'journal-native-action',action:'journal-book-end'},location.protocol==='file:'?'*':location.origin);}document.getElementById('confirm').onclick=finish;document.getElementById('exit').onclick=finish;addEventListener('keydown',e=>{if(e.key==='Escape')finish();});
</script></body></html>
