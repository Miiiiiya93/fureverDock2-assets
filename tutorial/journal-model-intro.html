<!doctype html>
<html lang="en">
<script src="web-bridge.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal · 3D model</title>
<style>
@font-face { font-family: JournalSans; src: url(fv-today/fonts/google-sans-flex-latin.woff2); font-weight: 100 900 }
body { margin: 0; color: white; font-family: JournalSans, system-ui, sans-serif }
main {
  pointer-events: none;
  --unit: min(0.078125vw, 0.120192vh);
  position: absolute;
  inset: 50% auto auto 50%;
  transform: translate(-50%, -50%);
  width: calc(1280 * var(--unit));
  height: calc(832 * var(--unit));
}
iframe { position: fixed; border: 0; inset: 0; width: 100%; height: 100%; background: transparent; color-scheme: light }
p { position: absolute; margin: 0; font-size: calc(24 * var(--unit)); line-height: 1.33; font-weight: 500; font-style: italic }
.opening-heading { left: calc(316 * var(--unit)); top: calc(73 * var(--unit)); width: calc(647 * var(--unit)); text-align: center; font-size: calc(36 * var(--unit)); line-height: calc(44 * var(--unit)); font-weight: 500; font-style: italic }
.right { left: 78.83%; top: 53.966%; width: 16.1% }
.right strong { font-weight: 900 }
nav { pointer-events: auto; position: fixed; top: 3.94vh; right: 2.81vw; z-index: 10 }
#exit { display: grid; place-items: center; padding: 0; border: 0; background: none; width: min(1.72vw, 2.64vh); height: min(1.72vw, 2.64vh) }
#exit img { display: block; width: 100%; height: auto }
button { font: inherit; color: inherit; border: 1px solid #fff8; background: #1b171666; border-radius: 999px; padding: 8px 18px; cursor: pointer }
</style>
<iframe title="Interactive 3D stair model"></iframe>
<main>
  <p class="opening-heading">The many sides of your life weave together into a story uniquely yours.</p>
</main>
  <nav aria-label="Tutorial">
    <button type="button" id="exit" aria-label="Exit tutorial"><img src="tutorial-exit.svg" alt=""></button>
  </nav>
<script>
const openingModel = document.querySelector('iframe');
const openingCopy = document.querySelectorAll('main > p');
let afterConnect = new URLSearchParams(location.search).get('phase') === 'after-connect';
if (afterConnect) openingCopy.forEach(line => { line.hidden = true; });
let connectorFrame=null,activeFrame=openingModel,connectorLoaded=false,connectorRequested=false;
let connectorEntered=false;
function showConnector(){if(!connectorLoaded||!connectorRequested||connectorEntered)return;connectorEntered=true;activeFrame=connectorFrame;document.querySelector('nav').hidden=true;connectorFrame.style.opacity='1';connectorFrame.style.pointerEvents='auto';connectorFrame.contentWindow.postMessage({type:'journal-connector-enter'},location.protocol==='file:'?'*':location.origin);openingModel.style.transition='opacity .6s ease';openingModel.style.opacity='0';setTimeout(()=>{if(connectorRequested)openingModel.style.visibility='hidden';},620);}
if(!afterConnect){connectorFrame=document.createElement('iframe');connectorFrame.title='Connector';connectorFrame.style.cssText='opacity:0;pointer-events:none;z-index:3;transition:opacity .6s ease';connectorFrame.onload=()=>{connectorLoaded=true;showConnector();};connectorFrame.src='journal-connect.html?fromOrb=1&v=orb-alpha-12';document.body.append(connectorFrame);}

let openingDuration=12.9;
window.addEventListener('message',event=>{
 if(event.source!==window.parent||event.data?.type!=='journal-transport')return;
 let command=event.data;
 if(command.action==='seek-global'&&Number.isFinite(command.time)){
  const nextPhase=command.time>openingDuration;
  if(nextPhase){
   afterConnect=true;connectorRequested=false;connectorEntered=false;activeFrame=openingModel;
   if(connectorFrame){connectorFrame.style.opacity='0';connectorFrame.style.pointerEvents='none';}
   openingModel.style.transition='none';openingModel.style.visibility='visible';openingModel.style.opacity='1';
   document.querySelector('nav').hidden=false;openingCopy.forEach(line=>line.style.opacity='0');
   send('journal-background-preload');
   openingModel.contentWindow.postMessage(command,location.protocol==='file:'?'*':location.origin);return;
  }
  if(afterConnect){afterConnect=false;openingModel.contentWindow.postMessage(command,location.protocol==='file:'?'*':location.origin);}
  command={...command,action:'seek',time:command.time};
 }
 if(!afterConnect&&connectorRequested&&(command.action==='seek'||command.action==='seek-end')&&Number.isFinite(command.time)&&command.time<openingDuration-.15){
  connectorRequested=false;connectorEntered=false;activeFrame=openingModel;
  connectorFrame.style.opacity='0';connectorFrame.style.pointerEvents='none';
  openingModel.style.transition='none';openingModel.style.visibility='visible';openingModel.style.opacity='1';
  document.querySelector('nav').hidden=false;
 }
 if(!afterConnect&&!connectorRequested&&(command.action==='seek'||command.action==='seek-end')&&Number.isFinite(command.time)&&command.time>=openingDuration-.15){
  openingModel.contentWindow.postMessage({type:'journal-transport',action:'seek',time:openingDuration},location.protocol==='file:'?'*':location.origin);
  openingCopy.forEach(line=>line.style.opacity='0');
  connectorRequested=true;showConnector();return;
 }
 activeFrame.contentWindow.postMessage(command,location.protocol==='file:'?'*':location.origin);
});
window.addEventListener('message', event => {
  if ((location.protocol !== 'file:' && event.origin !== location.origin) || (event.source !== openingModel.contentWindow && event.source !== connectorFrame?.contentWindow)) return;
  if(event.source===connectorFrame?.contentWindow&&event.data?.type==='journal-connector-continue'){
    window.parent.postMessage({type:'journal-seek-clear'},location.protocol==='file:'?'*':location.origin);
    afterConnect=true;connectorRequested=false;connectorEntered=false;activeFrame=openingModel;
    connectorFrame.style.opacity='0';connectorFrame.style.pointerEvents='none';
    openingModel.style.transition='none';openingModel.style.visibility='visible';openingModel.style.opacity='1';
    document.querySelector('nav').hidden=false;openingCopy.forEach(line=>line.style.opacity='0');
    send('journal-background-preload');
    openingModel.contentWindow.postMessage({type:'journal-transport',action:'seek-global',time:openingDuration+.000001,play:true},location.protocol==='file:'?'*':location.origin);return;
  }
  if(event.data?.type==='journal-native-action'){window.parent.postMessage(event.data,location.protocol==='file:'?'*':location.origin);return;}
  if(event.data?.type==='journal-progress'){
    if(event.source===openingModel.contentWindow&&Number.isFinite(event.data.total)){
      if(event.data.phase==='开场镜头')openingDuration=event.data.total;
      if(!afterConnect&&!connectorRequested&&event.data.playing&&event.data.time>=openingDuration-.15){connectorRequested=true;showConnector();}
      if(connectorEntered)return;
    }
    window.parent.postMessage(event.data,location.protocol==='file:'?'*':location.origin);
  }
  if (!afterConnect && event.data?.type === 'journal-shots-finished') {
    connectorRequested=true;showConnector();
    return;
  }
  if (afterConnect && event.data?.type === 'journal-ask-open') {
    send('journal-stage-ask');
    return;
  }
  if (event.data?.type !== 'journal-opening-copy') return;
  if(afterConnect){openingCopy.forEach(line=>{line.style.opacity='0';line.style.visibility='hidden';});return;}
  const { opacity } = event.data;
  if (!Number.isFinite(opacity) || opacity < 0 || opacity > 1) return;
  openingCopy.forEach(line => {
    line.style.opacity = opacity;
    line.style.visibility = opacity === 0 ? 'hidden' : 'visible';
  });
});
openingModel.onload=()=>window.parent.postMessage({type:'journal-transport-ready'},location.protocol==='file:'?'*':location.origin);
openingModel.src = afterConnect
  ? '实时协作版.html?phase=after-connect&rate=' + (new URLSearchParams(location.search).get('rate') === '2' ? '2' : '1')
  : '实时协作版.html?opening=10&canvas=screen&lunaDepth=1&connect=4';
if(new URLSearchParams(location.search).has('reviewTime'))openingModel.src+='&reviewTime='+encodeURIComponent(new URLSearchParams(location.search).get('reviewTime'));
openingModel.src+='&v=orb-alpha-12';
const send = action => window.webkit.messageHandlers.furever.postMessage({ action });
if(afterConnect) send('journal-background-preload');
else setTimeout(()=>send('journal-background-preload'),1200);
document.getElementById('exit').onclick = () => send('journal-book-end');
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') send('journal-book-end');
});
</script>
</html>
