<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Furever · Journal Tutorial</title><style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#534336 url(assets/home-bg.png) center/cover}body:before{content:'';position:fixed;inset:0;background:#05050580;backdrop-filter:blur(8px)}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent}#ask{z-index:2}#askExit{position:fixed;z-index:4;top:3.94vh;right:2.81vw;width:min(1.72vw,2.64vh);height:min(1.72vw,2.64vh);padding:0;background:none}#askSkip{display:none!important;position:fixed;z-index:4;top:3.94vh;right:calc(2.81vw + min(1.72vw,2.64vh) + 18px);height:min(1.72vw,2.64vh);padding:0;border:0;border-radius:0;background:none;color:white;font:16px system-ui;text-decoration:underline;text-underline-offset:4px;line-height:1;display:flex;align-items:center}#askSkip:disabled{opacity:.45;cursor:default}#askExit img{width:100%;height:100%}#background{z-index:1;opacity:0;pointer-events:none;transition:opacity .6s ease-in-out}#replay{position:fixed;inset:0;z-index:3;display:grid;place-items:center}button{font:20px system-ui;padding:15px 28px;border:0;border-radius:30px;cursor:pointer}[hidden]{display:none!important}#reviewProgress{position:fixed;z-index:50;left:50%;bottom:10px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;width:min(820px,calc(100vw - 32px));padding:9px 14px;border:1px solid #ffffff30;border-radius:16px;background:#25211edf;backdrop-filter:blur(12px);color:white;font:13px system-ui;box-sizing:border-box}#reviewProgress button{font:13px system-ui;padding:5px 10px;background:#ffffff1f;color:white;border-radius:7px;white-space:nowrap}#reviewSeek{flex:1;min-width:60px;accent-color:#d79c70}#reviewClock{font-variant-numeric:tabular-nums;white-space:nowrap}#reviewPhase{min-width:56px}#reviewProgress button:disabled{opacity:.4}</style></head><body><iframe id="stage" title="Journal tutorial" src="journal-model-intro.html?v=orb-alpha-12"></iframe><iframe id="background" title="Journal folding background"></iframe><iframe id="ending" title="Your Comma Book" style="z-index:60" hidden></iframe><iframe id="ask" title="Ask Luna" hidden></iframe><button id="askSkip" type="button" hidden>Skip</button><button id="askExit" hidden aria-label="Exit tutorial" onclick="closeTutorial()"><img src="tutorial-exit.svg" alt=""></button><div id="replay" hidden><button onclick="location.reload()">Replay Journal tutorial</button></div><div id="reviewProgress" aria-label="教程播放进度"><button id="reviewToggle" type="button">暂停</button><span id="reviewPhase">开场镜头</span><input id="reviewSeek" aria-label="播放进度（秒）" type="range" min="0" max="14.7" step="0.01" value="0"><output id="reviewClock">0.00 / 14.70s</output><button type="button" onclick="location.reload()">从头播放</button></div><script>
const stage=document.getElementById('stage'),ask=document.getElementById('ask'),background=document.getElementById('background');
const askSkip=document.getElementById('askSkip');askSkip.onclick=()=>ask.contentWindow.postMessage({type:'journal-skip-question'},location.protocol==='file:'?'*':location.origin);
const ending=document.getElementById('ending');let endingShown=false;function showBookEnding(){if(endingShown||tutorialClosed)return;endingShown=true;ending.src='journal-ending.html';ending.hidden=false;askSkip.hidden=true;document.getElementById('askExit').hidden=true;document.getElementById('reviewProgress').hidden=true;}
let tutorialClosed=false;
function closeTutorial(){
 if(tutorialClosed)return;tutorialClosed=true;
 for(const frame of [stage,ask,background,ending]){frame.hidden=true;frame.src='about:blank';}
 askSkip.hidden=true;document.getElementById('askExit').hidden=true;document.getElementById('reviewProgress').hidden=true;
 const dock=new URLSearchParams(location.search).get('dock')==='1';
 document.getElementById('replay').hidden=dock;
 if(dock){const handler=window.webkit?.messageHandlers?.furever;if(handler)handler.postMessage({action:'journal-book-end'});else parent.postMessage({type:'journal-native-action',action:'journal-book-end'},location.origin);}
}
addEventListener('keydown',event=>{if(event.key==='Escape')closeTutorial();});
let backgroundReady=false,askRequested=false,askShown=false;
function preloadBackground(){if(!background.getAttribute('src'))background.src='journal-background.html';}
function showAsk(){if(!askRequested||!backgroundReady||askShown)return;askShown=true;ask.src='ask.html?v=skip-counter-25';ask.hidden=false;}
addEventListener('message',event=>{if(location.protocol!=='file:'&&event.origin!==location.origin)return;const d=event.data;if(event.source===background.contentWindow&&d?.type==='journal-background-finished'){setTimeout(showBookEnding,450);return;}if(event.source===background.contentWindow&&d?.type==='journal-background-ready'){backgroundReady=true;showAsk();return;}if(d?.type!=='journal-native-action')return;if(d.action==='journal-book-end'||d.action==='dismiss-pet'){closeTutorial();return;}if(event.source===ask.contentWindow&&d.action==='journal-skip-state'){askSkip.hidden=!d.visible;askSkip.disabled=!!d.disabled;}if(d.action==='journal-ask-expanded'){askSkip.hidden=false;document.getElementById('askExit').hidden=false;background.style.opacity='1';setTimeout(()=>stage.style.visibility='hidden',600);}
if(d.action==='journal-conversation-finished'){askSkip.hidden=true;reviewTarget='background';ask.style.transition='opacity .3s ease';ask.style.opacity='0';background.contentWindow.postMessage({type:'journal-background-play'},location.protocol==='file:'?'*':location.origin);setTimeout(()=>{ask.hidden=true;},300);}
if(d.action==='journal-background-preload')preloadBackground();if(d.action==='journal-stage-ask'){setReviewWaiting('自由对话');askRequested=true;preloadBackground();showAsk();}});

const reviewSeek=document.getElementById('reviewSeek'),reviewClock=document.getElementById('reviewClock'),reviewToggle=document.getElementById('reviewToggle'),reviewPhase=document.getElementById('reviewPhase');let reviewTarget='stage',reviewDragging=false;const openingDuration=12.9,stageDuration=14.7;let latestStageSeek=null;
function setReviewWaiting(label){reviewPhase.textContent=label;reviewSeek.disabled=true;reviewToggle.disabled=true;reviewToggle.textContent='等待';}
function sendTransport(data){
 if(reviewTarget==='stage'&&(data.action==='seek'||data.action==='seek-end')){latestStageSeek=data.time;data={...data,action:'seek-global'};}
 (reviewTarget==='background'?background:stage).contentWindow.postMessage({type:'journal-transport',...data},location.protocol==='file:'?'*':location.origin);
}
addEventListener('message',event=>{
 if(event.source!==stage.contentWindow&&event.source!==background.contentWindow)return;
 const d=event.data;
 if(d?.type==='journal-seek-clear'){latestStageSeek=null;return;}
 if(d?.type==='journal-transport-ready'&&latestStageSeek!==null){sendTransport({action:'seek',time:latestStageSeek});return;}
 if(d?.type!=='journal-progress')return;
 if(d.phase==='变形动画'&&reviewTarget!=='background')return;
 if(d.waiting){if(d.phase==='Connector'){reviewTarget='stage';reviewPhase.textContent='Connector';reviewSeek.disabled=false;reviewSeek.max=stageDuration;reviewToggle.disabled=true;reviewToggle.textContent='等待';if(!reviewDragging)reviewSeek.value=openingDuration;reviewClock.textContent=openingDuration.toFixed(2)+' / '+stageDuration.toFixed(2)+'s';}else setReviewWaiting(d.phase);return;}
 reviewTarget=event.source===background.contentWindow?'background':'stage';reviewPhase.textContent=d.phase;reviewSeek.disabled=false;reviewToggle.disabled=false;
 const time=reviewTarget==='stage'&&d.phase==='后续镜头'?openingDuration+d.time:d.time;
 const total=reviewTarget==='stage'?stageDuration:d.total;
 reviewSeek.max=total;if(!reviewDragging)reviewSeek.value=time;
 reviewClock.textContent=time.toFixed(2)+' / '+total.toFixed(2)+'s';reviewToggle.textContent=d.playing?'暂停':'播放';
});
reviewSeek.addEventListener('pointerdown',()=>reviewDragging=true);reviewSeek.addEventListener('input',()=>{reviewClock.textContent=Number(reviewSeek.value).toFixed(2)+' / '+Number(reviewSeek.max).toFixed(2)+'s';sendTransport({action:'seek',time:Number(reviewSeek.value)});});reviewSeek.addEventListener('change',()=>{reviewDragging=false;sendTransport({action:'seek-end',time:Number(reviewSeek.value)});});reviewSeek.addEventListener('pointerup',()=>{reviewDragging=false;sendTransport({action:'seek-end',time:Number(reviewSeek.value)});});reviewToggle.onclick=()=>sendTransport({action:'toggle'});
</script></body></html>
