<!doctype html><html><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{width:300px;height:300px;display:block}</style><canvas width="450" height="450"></canvas><script>
const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl',{alpha:true,premultipliedAlpha:true,antialias:false});
const vertex='attribute vec2 position;void main(){gl_Position=vec4(position,0.,1.);}';
const fragment=`precision highp float;
uniform vec2 resolution;uniform float clock;uniform float morph;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float n=0.,a=.5;for(int i=0;i<4;i++){n+=a*noise(p);p=mat2(1.6,1.2,-1.2,1.6)*p+7.13;a*=.5;}return n;}
void main(){
 vec2 p=(gl_FragCoord.xy-resolution*.5)/(resolution.x*(52./300.));
 float corner=mix(1.,.069,morph);vec2 q=abs(p)-vec2(1.-corner);
 float sd=length(max(q,0.))+min(max(q.x,q.y),0.)-corner;
 float inside=1.-smoothstep(-.018,.018,sd);
 if(sd>.25){gl_FragColor=vec4(0.);return;}
 float t=clock*.65;
 vec2 w=p+vec2(fbm(p*3.+vec2(t,-t*.8)),fbm(p*3.-vec2(t*.6,t)))-.5;
 float cloud=fbm(w*6.+vec2(-t,t*.5));
 float fine=fbm(w*22.+vec2(t*1.7,-t));
 float strands=exp(-abs(fbm(w*15.+vec2(t*.7,-t*.4))-.5)*72.);
 float sparks=pow(noise(w*90.+t),20.);
 float core=exp(-dot(p,p)*2.2);
 float energy=clamp(core*(.46+.48*strands)+strands*.68+sparks*.3,0.,1.);
 float depth=clamp(-sd,0.,1.);
 vec3 amber=vec3(.72,.69,.67),orange=vec3(1.,.960784,.933333),cream=vec3(1.,.980392,.966667);
 vec3 color=mix(amber,orange,clamp(cloud*.85+depth*.5,0.,1.));
 color=mix(color,cream,clamp(energy*.9+strands*.22,0.,1.));
 color=mix(color,vec3(1.),smoothstep(.65,1.12,energy));
 float rim=exp(-abs(sd)*80.);color+=vec3(1.,.960784,.933333)*rim*.275;
 float outside=exp(-max(sd,0.)*19.)*.19;
 float alpha=max(inside,outside);gl_FragColor=vec4(min(color,vec3(1.))*alpha,alpha);
}`;
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const attribute=gl.getAttribLocation(program,'position');gl.enableVertexAttribArray(attribute);gl.vertexAttribPointer(attribute,2,gl.FLOAT,false,0,0);
const uniforms={resolution:gl.getUniformLocation(program,'resolution'),clock:gl.getUniformLocation(program,'clock'),morph:gl.getUniformLocation(program,'morph')};gl.viewport(0,0,450,450);gl.uniform2f(uniforms.resolution,450,450);gl.clearColor(0,0,0,0);
let shape=0,time=0,controlled=false,dirty=true;
function draw(){gl.uniform1f(uniforms.clock,time);gl.uniform1f(uniforms.morph,shape);gl.drawArrays(gl.TRIANGLES,0,3);}
for(const s of [0,1]){shape=s;draw();}gl.finish();shape=0;
addEventListener('message',event=>{if(event.source!==parent||event.data?.type!=='journal-orb-shape')return;shape=Math.max(0,Math.min(1,event.data.progress||0));if(Number.isFinite(event.data.time)){controlled=true;time=event.data.time-11.33;}dirty=true;});
function frame(now){requestAnimationFrame(frame);if(!controlled){time=now/1000;dirty=true;}if(dirty){draw();dirty=false;}}requestAnimationFrame(frame);
</script></html>
